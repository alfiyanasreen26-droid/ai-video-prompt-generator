
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Prompt Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#10111b;
  color:white;
  padding:25px 15px;
}
.container{
  max-width:650px;
  margin:auto;
  background:#1d2030;
  padding:25px;
  border-radius:18px;
}
h1{text-align:center;color:#a78bfa}
p{text-align:center;color:#c4c4d4}
label{display:block;margin-top:20px;margin-bottom:8px}
input,select,textarea{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #555;
  background:#292d40;
  color:white;
  font-size:16px;
}
textarea{min-height:90px}
button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:0;
  border-radius:9px;
  background:#8b5cf6;
  color:white;
  font-size:16px;
  font-weight:bold;
}
#result{min-height:150px}
</style>
</head>
<body>
<div class="container">
<h1>AI Video Prompt Generator</h1>
<p>Create creative prompts for AI video tools</p>

<label>Describe your video</label>
<textarea id="idea" placeholder="Example: A cinematic scene of a worker building a house"></textarea>

<label>Video style</label>
<select id="style">
<option>Cinematic</option>
<option>Realistic</option>
<option>Commercial Advertisement</option>
<option>Documentary</option>
<option>3D Animation</option>
</select>

<label>Camera movement</label>
<select id="camera">
<option>Slow camera movement</option>
<option>Tracking shot</option>
<option>Wide angle shot</option>
<option>Close-up shot</option>
<option>Drone shot</option>
</select>

<label>Video format</label>
<select id="format">
<option>9:16 Vertical</option>
<option>16:9 Landscape</option>
<option>1:1 Square</option>
</select>

<button onclick="generate()">Generate Prompt</button>

<label>Your Generated Prompt</label>
<textarea id="result" placeholder="Your prompt will appear here..." readonly></textarea>

<button onclick="copyPrompt()">Copy Prompt</button>
</div>

<script>
function generate(){
 const idea=document.getElementById("idea").value.trim();
 if(!idea){
   alert("Please describe your video first!");
   return;
 }
 const style=document.getElementById("style").value;
 const camera=document.getElementById("camera").value;
 const format=document.getElementById("format").value;

 const prompt=`Create a ${style.toLowerCase()} video showing ${idea}.

Camera: ${camera}.
Format: ${format}.
Quality: High resolution, detailed visuals, natural lighting, realistic movement, professional composition.

Make the scene visually engaging and maintain consistent subjects throughout the video.`;

 document.getElementById("result").value=prompt;
}

function copyPrompt(){
 const result=document.getElementById("result");
 if(!result.value){
   alert("Generate a prompt first!");
   return;
 }
 navigator.clipboard.writeText(result.value)
 .then(()=>alert("Prompt copied successfully!"))
 .catch(()=> {
   result.select();
   document.execCommand("copy");
   alert("Prompt copied!");
 });
}
</script>
</body>
</html>
