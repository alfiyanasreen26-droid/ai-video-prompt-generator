
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#10111c;color:white;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#c7a7ff}
.subtitle{text-align:center;color:#bbb}
.panel{background:#1d2030;padding:20px;border-radius:16px;margin-top:20px}
label{display:block;margin:18px 0 8px}
input,textarea,button{width:100%;padding:14px;border-radius:9px;border:1px solid #555;background:#292d40;color:white;font-size:16px}
textarea{min-height:110px}
button{background:#8955ed;border:0;font-weight:bold;margin-top:20px}
button:disabled{opacity:.5}
#preview,#video{width:100%;max-height:350px;object-fit:contain;margin-top:15px;display:none}
#message{color:#d4baff;line-height:1.5;white-space:pre-wrap}
a{color:#c7a7ff}
</style>
</head>
<body>
<div class="container">
<h1>✨ AI Video Studio</h1>
<p class="subtitle">Turn your images into amazing videos</p>

<div class="panel">
<label>Upload your image</label>
<input type="file" id="image" accept="image/*">
<img id="preview" alt="Image preview">

<label>Describe your video</label>
<textarea id="prompt" placeholder="Example: Make this sofa rotate slowly in a beautiful living room..."></textarea>

<button id="create" onclick="generate()">Create Video</button>

<p id="message"></p>
<video id="video" controls playsinline></video>
<p id="download"></p>
</div>
</div>

<script>
const imageInput=document.getElementById("image");
const message=document.getElementById("message");
const button=document.getElementById("create");

imageInput.addEventListener("change",()=>{
 const file=imageInput.files[0];
 if(file){
  document.getElementById("preview").src=URL.createObjectURL(file);
  document.getElementById("preview").style.display="block";
 }
});

async function generate(){
 const file=imageInput.files[0];
 const prompt=document.getElementById("prompt").value.trim();

 if(!file){
  message.textContent="Please upload an image first.";
  return;
 }
 if(!prompt){
  message.textContent="Please describe your video.";
  return;
 }

 button.disabled=true;
 message.textContent="Uploading image and starting video generation...";
 document.getElementById("video").style.display="none";
 document.getElementById("download").textContent="";

 try{
  const form=new FormData();
  form.append("image",file);
  form.append("prompt",prompt);

  const response=await fetch("/api/generate",{
   method:"POST",
   body:form
  });

  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"Could not start video.");
  if(!data.id) throw new Error("No video project ID received.");

  message.textContent="Video is generating. Please wait...";
  await checkVideo(data.id);

 }catch(error){
  message.textContent="Error: "+error.message;
 }finally{
  button.disabled=false;
 }
}

async function checkVideo(id){
 for(let i=0;i<60;i++){
  await new Promise(resolve=>setTimeout(resolve,5000));

  const response=await fetch("/api/status/"+encodeURIComponent(id));
  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Could not check video status.");
  }

  if(data.status==="complete"){
   const url=data.downloads?.[0]?.url;
   if(!url) throw new Error("Video is ready, but no download link was returned.");

   const player=document.getElementById("video");
   player.src=url;
   player.style.display="block";

   document.getElementById("download").innerHTML=
    '<a href="'+url+'" target="_blank" rel="noopener">Open or download your video</a>';

   message.textContent="Your video is ready!";
   return;
  }

  if(data.status==="error"||data.status==="canceled"){
   throw new Error("Video generation failed. Please try again.");
  }

  message.textContent="Video is processing... Please wait.";
 }

 message.textContent="Video is taking longer than expected. Check again later.";
}
</script>
</body>
</html>
