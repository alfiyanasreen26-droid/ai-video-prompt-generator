
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image to Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#10111c;color:white;padding:20px}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#c7a7ff}
.subtitle{text-align:center;color:#bbb}
.panel{background:#1d2030;padding:20px;border-radius:16px;margin-top:20px}
label{display:block;margin:15px 0 8px}
input,textarea,select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #555;background:#292d40;color:white;font-size:16px}
textarea{min-height:100px}
button{background:#8955ed;border:0;font-weight:bold;margin-top:18px}
#preview{width:100%;max-height:350px;object-fit:contain;margin-top:15px;border-radius:10px;display:none}
#message{color:#d4baff;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>✨ AI Video Studio</h1>
<p class="subtitle">Turn your images into amazing videos</p>
<div class="panel">
<label>Upload your image</label>
<input type="file" id="image" accept="image/*">
<img id="preview" alt="Image preview">
<label>Describe your video</label>
<textarea id="prompt" placeholder="Example: Make this sofa rotate slowly in a beautiful living room..."></textarea>
<label>Image type</label>
<select id="type">
<option>Product / Furniture</option>
<option>People / Fashion</option>
<option>Other</option>
</select>
<label>Video duration</label>
<select id="duration">
<option>5 seconds</option>
<option>10 seconds</option>
</select>
<label>Aspect ratio</label>
<select id="ratio">
<option>9:16 - Instagram Reels</option>
<option>16:9 - YouTube</option>
<option>1:1 - Instagram Post</option>
</select>
<button onclick="generate()">Create Video</button>
<p id="message"></p>
</div>
</div>
<script>
const imageInput=document.getElementById('image');
imageInput.addEventListener('change',function(){
const file=this.files[0];
if(file){
document.getElementById('preview').src=URL.createObjectURL(file);
document.getElementById('preview').style.display='block';
}
});
function generate(){
if(!imageInput.files.length){
document.getElementById('message').textContent='Please upload an image first.';
return;
}
document.getElementById('message').textContent='Your image is ready! The video generation service still needs to be connected. We will do that in the next stage.';
}
</script>
</body>
</html>
